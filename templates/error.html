{% extends "base.html" %}
{% block content %}
<div class="error-container" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 70vh; text-align: center; padding: 20px;">
    <div class="error-code" style="font-size: 6rem; font-weight: bold; color: #e74c3c; margin-bottom: 0.5rem;">{{ code }}</div>
    <div class="error-message" style="font-size: 1.5rem; color: #34495e; margin-bottom: 2rem;">{{ message }}</div>
    <a href="{{ url_for('index') }}" class="btn-home" style="text-decoration: none; background-color: #3498db; color: white; padding: 10px 20px; border-radius: 5px; transition: background 0.3s;">Return Home</a>
</div>
{% endblock %}
