{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="error-page" style="display: grid; place-items: center; text-align: center; min-height: 60vh;">
    <div class="glass-card" style="padding: 48px; max-width: 600px;">
        <h1 class="text-gradient" style="font-size: 6rem; margin: 0;">404</h1>
        <h2 style="font-size: 2rem; margin: 16px 0;">Lost in the Portal?</h2>
        <p style="color: var(--text-secondary); margin-bottom: 32px; font-size: 1.1rem;">
            The page you're looking for has vanished into the digital void or never existed in the first place.
        </p>
        <a href="{{ url_for('professor.dashboard' if session.role == 'professor' else 'student.dashboard') }}" class="btn btn-primary">
            Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
