{% extends "base.html" %}

{% block title %}413 - File Too Large{% endblock %}

{% block content %}
<div class="error-page" style="display: grid; place-items: center; text-align: center; min-height: 60vh;">
    <div class="glass-card" style="padding: 48px; max-width: 600px;">
        <h1 class="text-gradient" style="font-size: 6rem; margin: 0;">413</h1>
        <h2 style="font-size: 2rem; margin: 16px 0;">File Too Large</h2>
        <p style="color: var(--text-secondary); margin-bottom: 32px; font-size: 1.1rem;">
            The file you're trying to upload exceeds the 16MB size limit.
            Please compress your file or split it into smaller parts.
        </p>
        <a href="{{ url_for('professor.dashboard' if session.role == 'professor' else 'student.dashboard') }}" class="btn btn-primary">
            Go Back
        </a>
    </div>
</div>
{% endblock %}
